name: Build Native JARVIS AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout JARVIS project
        uses: actions/checkout@v4

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;27.2.12479018"

      - name: Apply JARVIS custom UI and logo
        run: |
          APP=llama.cpp/examples/llama.android/app/src/main
          cp -R native-overrides/app/src/main/java/. "$APP/java/"
          cp -R native-overrides/app/src/main/res/. "$APP/res/"
          python - <<'INNER'
          from pathlib import Path
          import re
          p = Path("llama.cpp/examples/llama.android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/ic_jarvis_logo"', s, count=1)
          s = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@drawable/ic_jarvis_logo"', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="JARVIS AI"', s, count=1)
          if "android.permission.RECORD_AUDIO" not in s:
              match = re.search(r"<manifest\b[^>]*>", s)
              if not match:
                  raise SystemExit("Manifest opening tag not found")
              s = s[:match.end()] + chr(10) + '    <uses-permission android:name="android.permission.RECORD_AUDIO" />' + s[match.end():]
          p.write_text(s)
          INNER

      - name: Configure Kotlin JVM target
        working-directory: llama.cpp/examples/llama.android
        run: |
          cat >> lib/build.gradle.kts <<'KOTLIN'

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          KOTLIN

      - name: Build native APK
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Native-Debug-APK
          path: llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
