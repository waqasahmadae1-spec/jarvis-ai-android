name: Build Native JARVIS AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout JARVIS project
        uses: actions/checkout@v4

      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.31.6" \
            "ndk;27.2.12479018"

      - name: Apply JARVIS custom UI and logo
        run: |
          APP=llama.cpp/examples/llama.android/app/src/main
          cp -R native-overrides/app/src/main/java/. "$APP/java/"
          cp -R native-overrides/app/src/main/res/. "$APP/res/"
          mkdir -p "$APP/assets" "$APP/jniLibs"
          cp -R native-overrides/app/src/main/assets/. "$APP/assets/"
          cp -R native-overrides/app/src/main/jniLibs/. "$APP/jniLibs/"
          python - <<'INNER'
          from pathlib import Path
          import re
          p = Path("llama.cpp/examples/llama.android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              match = re.search(r"<manifest\b[^>]*>", s)
              if not match:
                  raise SystemExit("Manifest opening tag not found for INTERNET permission")
              s = s[:match.end()] + chr(10) + '    <uses-permission android:name="android.permission.INTERNET" />' + s[match.end():]
          s = re.sub(r'android:icon="[^"]*"', 'android:icon="@drawable/ic_jarvis_logo"', s, count=1)
          s = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@drawable/ic_jarvis_logo"', s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="JARVIS AI"', s, count=1)
          if "<queries>" not in s:
              match = re.search(r"<manifest\b[^>]*>", s)
              if not match:
                  raise SystemExit("Manifest opening tag not found for queries")
              queries = """\n    <queries>
                <package android:name="com.google.android.youtube" />
                <package android:name="com.android.chrome" />
              </queries>"""
              s = s[:match.end()] + queries + s[match.end():]
          if "android.permission.RECORD_AUDIO" not in s:
              match = re.search(r"<manifest\b[^>]*>", s)
              if not match:
                  raise SystemExit("Manifest opening tag not found")
              s = s[:match.end()] + chr(10) + '    <uses-permission android:name="android.permission.RECORD_AUDIO" />' + s[match.end():]
          p.write_text(s)
          INNER

      - name: Set separate JARVIS application ID
        working-directory: llama.cpp/examples/llama.android
        run: |
          python - <<'INNER'
          from pathlib import Path
          import re

          candidates = [
              Path("app/build.gradle.kts"),
              Path("app/build.gradle"),
          ]

          for p in candidates:
              if not p.exists():
                  continue
              s = p.read_text()
              pattern = r'(?m)^(\s*applicationId\s*(?:=\s*)?)(["\x27])[^"\x27]+\2'
              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + '"com.jarvis.ai.new"',
                  s,
                  count=1
              )
              if count:
                  p.write_text(updated)
                  print("Updated actual APK package in:", p)
                  break
          else:
              raise SystemExit("ERROR: Could not find applicationId in actual Android app Gradle file.")
          INNER

      - name: Configure Kotlin JVM target
        working-directory: llama.cpp/examples/llama.android
        run: |
          cat >> lib/build.gradle.kts <<'KOTLIN'

          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          KOTLIN

      - name: Build native APK
        working-directory: llama.cpp/examples/llama.android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/jarvis-build.log"
      - name: Upload build diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Build-Log
          path: jarvis-build.log
          if-no-files-found: warn
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Native-Debug-APK
          path: llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
